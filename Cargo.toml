[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/worker",
    "crates/live",
    "crates/keyserver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ishaan Satapathy"]
rust-version = "1.85"

[workspace.dependencies]
# runtime / web
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
http-body-util = "0.1"
async-trait = "0.1"

# data
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json", "ipnetwork"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# security
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
email_address = "0.2"
url = "2"
unicode-normalization = "0.1"
time = "0.3"

# object storage and media
rusty-s3 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
ring = "0.17"

# plumbing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
