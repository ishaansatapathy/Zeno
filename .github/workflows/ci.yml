name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zeno
          POSTGRES_PASSWORD: zeno
          POSTGRES_DB: zeno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zeno -d zeno"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # MinIO no longer publishes official images; this is the last Bitnami build, by digest.
      minio:
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: zeno-ci
          MINIO_ROOT_PASSWORD: zeno-ci-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://zeno:zeno@localhost:5432/zeno
      TEST_REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: zeno-ci
      S3_ACCESS_KEY: zeno-ci
      S3_SECRET_KEY: zeno-ci-secret
    steps:
      - uses: actions/checkout@v4
      # The worker's tests run real ffmpeg (with libx264) on generated videos.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
