name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; this only stops a hung step from burning hours.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zeno
          POSTGRES_PASSWORD: zeno
          POSTGRES_DB: zeno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zeno -d zeno"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # MinIO no longer publishes official images; this is the last Bitnami build, by digest.
      minio:
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: zeno-ci
          MINIO_ROOT_PASSWORD: zeno-ci-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://zeno:zeno@localhost:5432/zeno
      TEST_REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: zeno-ci
      S3_ACCESS_KEY: zeno-ci
      S3_SECRET_KEY: zeno-ci-secret
    steps:
      - uses: actions/checkout@v4
      # The worker's tests run real ffmpeg (with libx264) on generated videos.
      # The package mirror sometimes stalls mid-download (once for 26 minutes, and apt's own
      # per-request timeout does not catch it), so each attempt is killed after 3 minutes and
      # retried, and the step itself is capped.
      - run: |
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "apt attempt $attempt failed or stalled; retrying"
            sleep 5
          done
          exit 1
        timeout-minutes: 12
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # 0009 replaced an unused pre-production placeholder. From 0010 onward migrations are
      # expand-only so an old binary can run while a new release rolls out.
      - name: Reject destructive forward migrations
        run: |
          if grep -Eini '\b(drop[[:space:]]+(table|column)|rename[[:space:]]+(table|column))\b' deploy/migrations/00[1-9][0-9]_*.sql 2>/dev/null; then
            echo 'Use an expand/contract migration; destructive DDL is not allowed in this release.'
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
